spring:
  application:
    name: susume
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: anveshak.noreply@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast when Redis is unreachable so the recommendation cache falls back to computing results.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false 

  rabbitmq:
    addresses: ${RABBITMQ_URL:}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1}


jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  private-key-file: ${PRIVATE_KEY_PATH}
  public-key-file: ${PUBLIC_KEY_PATH}

app:
  mail:
    from: anveshak.noreply@gmail.com
  base-url: http://localhost:8080

recommendation:
  max-limit: 50
  ml:
    enabled: ${RECOMMENDATION_ML_ENABLED:true}
    service-url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8002}
    timeout-ms: ${RECOMMENDATION_ML_TIMEOUT_MS:500}
  # Final recommendation lists cached in Redis; see docs/recommendation-cache.md.
  cache:
    enabled: ${RECOMMENDATION_CACHE_ENABLED:true}
    # Keyed by the strategy that served the response.
    ttl:
      personalized_ml_reranked: 15m
      personalized_cold_start_popularity: 5m
      personalized: 1m
      trending: 5m
    default-ttl: 5m
    ttl-jitter: 0.1
    # Must outlive every entry TTL; interaction-service uses the same value.
    generation-ttl: ${RECOMMENDATION_CACHE_GENERATION_TTL:24h}
    failure-backoff: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics


