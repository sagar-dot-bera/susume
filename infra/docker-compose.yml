services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: recommendation_postgres
    environment:
      POSTGRES_DB: recommendation_engine
      POSTGRES_USER: sagar
      POSTGRES_PASSWORD: Denji@0086
    ports:
      - "5433:5432"
    volumes:
      - type: bind
        source: D:/Susume/docker-data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sagar -d recommendation_engine" ]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    build: ../embedding-service
    container_name: recommendation_embedding
    ports:
      - "8001:8001"
    volumes:
      - type: bind
        source: D:/Susume/docker-data/huggingface
        target: /root/.cache/huggingface
    environment:
      MODEL_NAME: all-MiniLM-L6-v2
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: ../api-service
    container_name: recommendation_api
    ports:
      - "8082:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/recommendation_engine
      DATABASE_USERNAME: sagar
      DATABASE_PASSWORD: Denji@0086
      JWT_SECRET: replace_with_secret_key_here
      JWT_EXPIRY_HOURS: 24
      EMBEDDING_SERVICE_URL: http://embedding:8001
      EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2
      MAX_RECOMMENDATION_LIMIT: 50
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
