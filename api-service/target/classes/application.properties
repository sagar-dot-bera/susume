spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recommendation_engine}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET:replace_with_256bit_secret_key}
jwt.expiry-hours=${JWT_EXPIRY_HOURS:24}

embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:8001}
embedding.model.name=${EMBEDDING_MODEL_NAME:all-MiniLM-L6-v2}

recommendation.max-limit=${MAX_RECOMMENDATION_LIMIT:50}

server.port=8080
spring.application.name=recommendation-engine-api

management.endpoints.web.exposure.include=health,info

spring.data.redis.host=localhost
spring.data.redis.port=6379
