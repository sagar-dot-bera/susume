# Test Configuration
spring.datasource.url=jdbc:postgresql://localhost/susume_test
spring.datasource.username=test_user
spring.datasource.password=test_password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true

jwt.secret=test_secret_key_256bit_minimum_for_testing_purposes_only_do_not_use_production
jwt.expiry-hours=24

embedding.service.url=http://localhost:8001
embedding.model.name=all-MiniLM-L6-v2

recommendation.max-limit=50

server.port=8080
spring.application.name=recommendation-engine-api-test

# Disable actuator endpoints in tests
management.endpoints.web.exposure.include=health

# Log level for testing
logging.level.com.susume=DEBUG
logging.level.org.springframework.test.context=DEBUG
