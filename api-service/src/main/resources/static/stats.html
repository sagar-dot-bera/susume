<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - Recommendation Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50">
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-slate-800">Usage & Statistics</h1>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Interaction Trends</h3>
                <div id="trendChart"
                    class="h-32 bg-slate-50 rounded text-center text-slate-500 flex items-center justify-center">
                    Chart placeholder
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Top Items</h3>
                <div id="topItems" class="space-y-2">
                    <div class="text-slate-500 text-center py-8">Loading...</div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold text-slate-800 mb-4">Daily Summary</h3>
            <div id="dailySummary" class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="border-b border-slate-200">
                        <tr>
                            <th class="text-left py-2 px-4">Date</th>
                            <th class="text-left py-2 px-4">Interactions</th>
                            <th class="text-left py-2 px-4">Unique Users</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-600">
                        <tr>
                            <td colspan="3" class="text-center py-8">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/assets/app.js"></script>
</body>

</html>
